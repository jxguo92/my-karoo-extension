<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ladder · Karoo Data Field UI prototype</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, "Noto Sans SC", sans-serif; background: #10151c; color: #eaf0f2; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    .workspace { width: min(100%, 1050px); min-height: 100vh; padding: 26px 24px; display: flex; align-items: center; justify-content: center; gap: 48px; }
    .screen { width: min(480px, calc(100vw - 32px)); aspect-ratio: 3 / 5; flex: none; border-radius: 8px; overflow: hidden; box-shadow: 0 34px 80px #0009; }
    .screen svg { display: block; width: 100%; height: 100%; }
    .notes { max-width: 290px; align-self: center; }
    .eyebrow { font-size: 11px; letter-spacing: .22em; font-weight: 800; color: #93b0b5; }
    h1 { margin: 10px 0 16px; font-size: 29px; line-height: 1.15; }
    .notes p { margin: 0 0 22px; color: #aabac0; line-height: 1.6; font-size: 14px; }
    .state { border: 1px solid #40515b; border-radius: 12px; padding: 16px; background: #1b242d; }
    .state-title { font-size: 12px; font-weight: 800; letter-spacing: .12em; color: #c4d9d9; margin-bottom: 13px; }
    .state-grid { display: grid; grid-template-columns: 1fr auto; gap: 8px 18px; font-size: 13px; color: #adbdc2; }
    .state-grid strong { color: #fff; font-variant-numeric: tabular-nums; }
    .state small { display: block; margin-top: 14px; color: #7d939d; line-height: 1.5; }
    .prototype-tag { position: fixed; top: 12px; left: 16px; color: #82949d; font-size: 10px; letter-spacing: .15em; }
    .prototype-switcher { position: fixed; z-index: 10; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 7px; border: 1px solid #63737c; border-radius: 999px; background: #080d11eb; box-shadow: 0 12px 32px #000a; backdrop-filter: blur(12px); }
    .prototype-switcher button { width: 34px; height: 34px; padding: 0; border: 0; border-radius: 50%; background: #25323a; color: #f4f8f8; font-size: 18px; cursor: pointer; }
    .prototype-switcher button:hover { background: #3a4b55; }
    .prototype-switcher span { min-width: 132px; color: #dce7e9; font-size: 12px; font-weight: 800; letter-spacing: .05em; text-align: center; }
    @media (max-width: 850px) { .workspace { flex-direction: column; gap: 22px; padding: 28px 16px; } .notes { max-width: min(480px, 100%); width: 100%; } .notes p { margin-bottom: 12px; } .state { display: none; } }
    @media (max-width: 520px) { .prototype-tag { display: none; } .workspace { padding-top: 10px; } .screen { width: min(480px, calc(100vw - 20px)); } .notes h1 { font-size: 19px; margin: 6px 0; } .notes p { font-size: 12px; } }
  </style>
</head>
<body>
  <!-- Three ladder dashboard variants, switchable via ?variant=A, ?variant=B, or ?variant=C on this prototype page. -->
  <div class="prototype-tag">THROWAWAY UI PROTOTYPE · LADDER</div>
  <main class="workspace">
    <div class="screen" id="screen" role="img" aria-label="Karoo 仪表盘原型，功率、心率和踏频自动变化"></div>
    <aside class="notes">
      <div class="eyebrow">KAROO · 480 × 800</div>
      <h1>双轨座舱</h1>
      <p id="variant-description"></p>
      <div class="state" aria-live="off">
        <div class="state-title">模拟实时状态</div>
        <div class="state-grid">
          <span>3 秒功率</span><strong id="power-state"></strong>
          <span>心率</span><strong id="hr-state"></strong>
          <span>踏频</span><strong id="cadence-state"></strong>
          <span>速度</span><strong id="speed-state"></strong>
        </div>
        <small>踏频只在仪表中显示为灯珠；这里的数字用于观察模拟状态。</small>
      </div>
    </aside>
  </main>
  <nav class="prototype-switcher" aria-label="原型方案切换">
    <button id="previous-variant" type="button" aria-label="上一套方案">←</button>
    <span id="variant-label" aria-live="polite"></span>
    <button id="next-variant" type="button" aria-label="下一套方案">→</button>
  </nav>
  <script>
    const zoneColors = ['#55c99c', '#5cbce5', '#4280ea', '#ebcb52', '#ff8a5c', '#ed547a', '#a774f6'];
    const ftp = 200;
    const powerBounds = [.41, .55, .75, .9, 1.05, 1.2, 1.5, 2].map(percent => Math.round(percent * ftp));
    const restingHr = 50;
    const maxHr = 190;
    const hrr = maxHr - restingHr;
    const hrBounds = [.41, .5, .6, .7, .8, .9, 1].map(percent => restingHr + percent * hrr);
    const speedMin = 0;
    const speedMax = 60;
    const speedStep = 10;
    const speedBounds = Array.from({ length: 7 }, (_, index) => speedMin + index * speedStep);
    const speedMinorTicksPerSegment = 5;
    const sideRailWidth = 20;
    const centerRailWidth = 16;
    const centerTickGap = 4;
    const railFillRatio = .6;
    const variants = ['A', 'B', 'C'];
    const variantNames = { A: '分区阶梯', B: '连续填充', C: '功率核心' };
    const variantDescriptions = {
      A: '两条宽分区轨道向下张开，中央是速度圆表。功率、心率和踏频按固定波形自动变化。',
      B: '左右轨道采用与速度圆弧一致的连续填充方式；填充色随当前功率和心率所属区域整体变化。',
      C: '3 秒功率移至中央圆环并随功率区间变色；速度移至左侧，以固定青蓝色连续填充。'
    };
    const screen = document.getElementById('screen');
    const requestedVariant = new URLSearchParams(window.location.search).get('variant')?.toUpperCase();
    let activeVariant = variants.includes(requestedVariant) ? requestedVariant : 'A';
    const angle = d => d * Math.PI / 180;
    const point = (cx, cy, r, d) => [cx + r * Math.cos(angle(d)), cy + r * Math.sin(angle(d))];
    const arc = (cx, cy, r, a0, a1) => {
      const [x0, y0] = point(cx, cy, r, a0), [x1, y1] = point(cx, cy, r, a1);
      return `M ${x0.toFixed(1)} ${y0.toFixed(1)} A ${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;
    };
    const txt = (x, y, value, size, color = '#eef5f5', anchor = 'middle', weight = 700, extra = '') =>
      `<text x="${x}" y="${y}" fill="${color}" font-family="Arial, sans-serif" font-size="${size}" font-weight="${weight}" text-anchor="${anchor}" ${extra}>${value}</text>`;
    const line = (x1, y1, x2, y2, color, width = 1, opacity = 1) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${width}" opacity="${opacity}"/>`;
    const rect = (x, y, w, h, fill, radius = 0, extra = '') => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${radius}" fill="${fill}" ${extra}/>`;
    const path = (d, stroke, width, fill = 'none', extra = '') => `<path d="${d}" stroke="${stroke}" stroke-width="${width}" fill="${fill}" ${extra}/>`;

    function steppedTriangle(elapsed, min, max, increment, phaseSteps = 0) {
      const steps = (max - min) / increment;
      const position = (Math.floor(elapsed / .85) + phaseSteps) % (steps * 2);
      const step = position <= steps ? position : steps * 2 - position;
      return min + step * increment;
    }
    function reading(elapsed) {
      return {
        power: steppedTriangle(elapsed, 80, 400, 20),
        hr: steppedTriangle(elapsed, 100, 180, 5, 7),
        cadence: Math.round(88 + 15 * Math.sin(elapsed / 7.4 + 1.2) + 4 * Math.sin(elapsed / 2.7)),
        speed: 28.6
      };
    }
    function zoneFraction(value, bounds) {
      const v = Math.max(bounds[0], Math.min(value, bounds[bounds.length - 1]));
      for (let i = 0; i < bounds.length - 1; i++) {
        if (v <= bounds[i + 1]) return (i + (v - bounds[i]) / (bounds[i + 1] - bounds[i])) / (bounds.length - 1);
      }
      return 1;
    }
    function zoneColor(value, bounds) {
      const n = bounds.length - 1;
      const v = Math.max(bounds[0], Math.min(value, bounds[bounds.length - 1]));
      let zone = n - 1;
      for (let i = 0; i < n; i++) {
        if (v <= bounds[i + 1]) {
          zone = i;
          break;
        }
      }
      const colorIndex = n === 6 ? [0, 1, 2, 3, 5, 6][zone] : zone;
      return zoneColors[colorIndex];
    }
    function commonFrame(bg, border) {
      return rect(0, 0, 480, 800, bg, 8) +
        rect(1, 1, 478, 798, 'none', 8, `stroke="${border}" stroke-width="2"`) +
        line(0, 81, 480, 81, border) + line(0, 719, 480, 719, border) +
        txt(25, 49, '01:24:36', 23, '#f4f7f8', 'start', 700, 'font-variant-numeric="tabular-nums"') +
        txt(455, 49, '14:32', 23, '#f4f7f8', 'end', 700, 'font-variant-numeric="tabular-nums"');
    }
    function cadenceLights(cadence) {
      const active = Math.max(1, Math.min(12, Math.floor((cadence - 51) / 5) + 1));
      const start = 51, end = 429, width = 24;
      const step = (end - start - width) / 11;
      let out = '';
      for (let i = 0; i < 12; i++) {
        const x = start + i * step;
        const color = i < 6 ? '#edf2ed' : i < 10 ? '#69d697' : '#f36b65';
        const opacity = i < active ? 1 : .18;
        out += rect(x, 119, width, 35, color, 3, `opacity="${opacity}"`);
      }
      return out;
    }
    function segmentedRail(side, value, bounds) {
      const n = bounds.length - 1;
      const top = 202, bottom = 527;
      const yAt = f => bottom - (bottom - top) * f;
      const centerX = side === 'left' ? 76 : 404;
      const spread = y => (y - top) * .075;
      const xAt = y => centerX + (side === 'left' ? -1 : 1) * spread(y);
      const width = sideRailWidth;
      const guideOffset = width / 2 + 8;
      let out = '';
      out += path(`M ${centerX - guideOffset} ${top - 15} L ${xAt(bottom) - guideOffset} ${bottom + 14} M ${centerX + guideOffset} ${top - 15} L ${xAt(bottom) + guideOffset} ${bottom + 14}`, '#50606a', 1, 'none', 'opacity=".65"');
      for (let i = 0; i < n; i++) {
        const y0 = yAt((i + 1) / n) + 2, y1 = yAt(i / n) - 2;
        const x0 = xAt(y0), x1 = xAt(y1);
        const left0 = x0 - width / 2, right0 = x0 + width / 2;
        const left1 = x1 - width / 2, right1 = x1 + width / 2;
        const colorIndex = n === 6 ? [0, 1, 2, 3, 5, 6][i] : i;
        out += `<polygon points="${left0},${y0} ${right0},${y0} ${right1},${y1} ${left1},${y1}" fill="${zoneColors[colorIndex]}" opacity="0.9"/>`;
      }
      const f = zoneFraction(value, bounds), y = yAt(f), x = xAt(y);
      const markerHalfWidth = width / 2 + 4;
      out += line(x - markerHalfWidth, y, x + markerHalfWidth, y, '#f7fbfa', 3);
      return out;
    }
    function continuousRail(side, value, bounds, fillColor = zoneColor(value, bounds)) {
      const top = 202, bottom = 527;
      const yAt = f => bottom - (bottom - top) * f;
      const centerX = side === 'left' ? 76 : 404;
      const spread = y => (y - top) * .075;
      const xAt = y => centerX + (side === 'left' ? -1 : 1) * spread(y);
      const f = zoneFraction(value, bounds);
      const y = yAt(f);
      const guideOffset = sideRailWidth / 2 + 8;
      let out = path(`M ${centerX - guideOffset} ${top - 15} L ${xAt(bottom) - guideOffset} ${bottom + 14} M ${centerX + guideOffset} ${top - 15} L ${xAt(bottom) + guideOffset} ${bottom + 14}`, '#50606a', 1, 'none', 'opacity=".65"');
      out += path(`M ${xAt(bottom)} ${bottom} L ${centerX} ${top}`, '#435761', sideRailWidth, 'none', 'stroke-linecap="round"');
      out += path(`M ${xAt(bottom)} ${bottom} L ${xAt(y)} ${y}`, fillColor, sideRailWidth * railFillRatio, 'none', 'stroke-linecap="round"');
      for (let i = 1; i < bounds.length - 1; i++) {
        const tickY = yAt(i / (bounds.length - 1));
        const tickX = xAt(tickY);
        out += path(`M ${tickX - 4.5} ${tickY} L ${tickX + 4.5} ${tickY}`, '#50606a', 3, 'none', 'opacity=".72" stroke-linecap="round"');
        out += path(`M ${tickX - 1.5} ${tickY} L ${tickX + 1.5} ${tickY}`, '#50606a', 1, 'none', 'opacity=".95" stroke-linecap="round"');
      }
      return out;
    }
    function powerArc(cx, cy, radius, power) {
      const powerFraction = zoneFraction(power, powerBounds);
      let out = path(arc(cx, cy, radius, -225, 45), '#435761', centerRailWidth, 'none', 'stroke-linecap="round"');
      out += path(arc(cx, cy, radius, -225, -225 + 270 * powerFraction), zoneColor(power, powerBounds), centerRailWidth * railFillRatio, 'none', 'stroke-linecap="round"');
      const majorTicks = powerBounds.length;
      const tickStartRadius = radius + centerRailWidth / 2 + centerTickGap;
      for (let i = 0; i < majorTicks; i++) {
        const a = -225 + i * 270 / (majorTicks - 1);
        const p0 = point(cx, cy, tickStartRadius, a);
        const p1 = point(cx, cy, tickStartRadius + 10, a);
        out += line(p0[0], p0[1], p1[0], p1[1], '#c6d7d9', 2);
      }
      return out;
    }
    function speedArc(cx, cy, radius, speed) {
      const clampedSpeed = Math.max(speedMin, Math.min(speed, speedMax));
      const speedFraction = (clampedSpeed - speedMin) / (speedMax - speedMin);
      let out = path(arc(cx, cy, radius, -225, 45), '#435761', centerRailWidth, 'none', 'stroke-linecap="round"');
      out += path(arc(cx, cy, radius, -225, -225 + 270 * speedFraction), '#7bdbce', centerRailWidth * railFillRatio, 'none', 'stroke-linecap="round"');
      const speedSegments = (speedMax - speedMin) / speedStep;
      const speedTicks = speedSegments * speedMinorTicksPerSegment;
      const tickStartRadius = radius + centerRailWidth / 2 + centerTickGap;
      for (let i = 0; i <= speedTicks; i++) {
        const a = -225 + i * 270 / speedTicks;
        const major = i % speedMinorTicksPerSegment === 0;
        const p0 = point(cx, cy, tickStartRadius, a);
        const p1 = point(cx, cy, tickStartRadius + (major ? 10 : 5), a);
        out += line(p0[0], p0[1], p1[0], p1[1], major ? '#c6d7d9' : '#69818a', major ? 2 : 1);
      }
      return out;
    }
    function auxRow() {
      const muted = '#94aeb6';
      const text = '#e9f3f2';
      let out = '';
      const topY = 606, valY = topY + 27;
      const topFields = [['AVG PWR', '198', 'W', 89], ['AVG SPD', '27.4', 'km/h', 240], ['AVG HR', '148', 'bpm', 391]];
      topFields.forEach(([label, value, unit, x]) => {
        out += txt(x, topY, label, 12.1, muted, 'middle', 700, 'letter-spacing="1"');
        out += txt(x, valY, value, 27.5, text) + txt(x + (value.length > 3 ? 38 : 29), valY, unit, 11, muted, 'start');
      });
      const lowY = 677;
      out += txt(166, lowY, 'NP', 11, muted, 'middle', 700, 'letter-spacing="1"') + txt(166, lowY + 25, '214 W', 24.2, text);
      out += txt(315, lowY, 'DIST', 11, muted, 'middle', 700, 'letter-spacing="1"') + txt(315, lowY + 25, '42.7 km', 24.2, text);
      return out;
    }
    function dashboardWithRails(d, railRenderer) {
      let out = commonFrame('#111b22', '#42545d') + cadenceLights(d.cadence);
      out += railRenderer('left', d.power, powerBounds) + railRenderer('right', d.hr, hrBounds);
      out += speedArc(240, 386, 111, d.speed);
      out += path('M 135 230 L 115 210 L 116 222', '#e9f3f2', 2.5, 'none', 'stroke-linecap="round" stroke-linejoin="round"');
      out += path('M 345 230 L 365 210 L 362 223', '#e9f3f2', 2.5, 'none', 'stroke-linecap="round" stroke-linejoin="round"');
      out += txt(240, 232, '3.6%', 22, '#e9f3f2');
      out += txt(240, 330, '6/13', 20.88, '#9db9c0', 'middle', 700, 'letter-spacing="1"');
      out += txt(240, 392, d.speed.toFixed(1), 64, '#f5faf8', 'middle', 700, 'dominant-baseline="middle"') + txt(240, 446, 'km/h', 15, '#9ab2ba', 'middle', 700, 'letter-spacing="2"');
      out += txt(122, 538, String(d.power), 36) + txt(122, 557, 'W', 12, '#9db3ba');
      out += txt(358, 538, String(d.hr), 36) + txt(358, 557, 'bpm', 12, '#9db3ba');
      out += `<g transform="translate(0 -16)">${auxRow()}</g>`;
      return out;
    }
    function dashboardVariantC(d) {
      let out = commonFrame('#111b22', '#42545d') + cadenceLights(d.cadence);
      out += continuousRail('left', d.speed, speedBounds, '#7bdbce') + continuousRail('right', d.hr, hrBounds);
      out += powerArc(240, 386, 111, d.power);
      out += path('M 135 230 L 115 210 L 116 222', '#e9f3f2', 2.5, 'none', 'stroke-linecap="round" stroke-linejoin="round"');
      out += path('M 345 230 L 365 210 L 362 223', '#e9f3f2', 2.5, 'none', 'stroke-linecap="round" stroke-linejoin="round"');
      out += txt(240, 232, '3.6%', 22, '#e9f3f2');
      out += txt(240, 330, '6/13', 20.88, '#9db9c0', 'middle', 700, 'letter-spacing="1"');
      out += txt(240, 392, String(d.power), 64, '#f5faf8', 'middle', 700, 'dominant-baseline="middle"') + txt(240, 446, 'W', 15, '#9ab2ba', 'middle', 700, 'letter-spacing="2"');
      out += txt(122, 538, d.speed.toFixed(1), 36) + txt(122, 557, 'km/h', 12, '#9db3ba');
      out += txt(358, 538, String(d.hr), 36) + txt(358, 557, 'bpm', 12, '#9db3ba');
      out += `<g transform="translate(0 -16)">${auxRow()}</g>`;
      return out;
    }
    const dashboardVariants = {
      A: d => dashboardWithRails(d, segmentedRail),
      B: d => dashboardWithRails(d, continuousRail),
      C: dashboardVariantC
    };
    function render() {
      const d = reading(performance.now() / 1000);
      screen.innerHTML = `<svg viewBox="0 0 480 800" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${dashboardVariants[activeVariant](d)}</svg>`;
      document.getElementById('power-state').textContent = `${d.power} W`;
      document.getElementById('hr-state').textContent = `${d.hr} bpm`;
      document.getElementById('cadence-state').textContent = `${d.cadence} rpm`;
      document.getElementById('speed-state').textContent = `${d.speed.toFixed(1)} km/h`;
    }
    function setVariant(nextVariant, updateUrl = true) {
      activeVariant = nextVariant;
      document.getElementById('variant-label').textContent = `${activeVariant} — ${variantNames[activeVariant]}`;
      document.getElementById('variant-description').textContent = variantDescriptions[activeVariant];
      if (updateUrl) {
        const url = new URL(window.location.href);
        url.searchParams.set('variant', activeVariant);
        window.history.replaceState(null, '', url);
      }
      render();
    }
    function cycleVariant(direction) {
      const currentIndex = variants.indexOf(activeVariant);
      setVariant(variants[(currentIndex + direction + variants.length) % variants.length]);
    }
    document.getElementById('previous-variant').addEventListener('click', () => cycleVariant(-1));
    document.getElementById('next-variant').addEventListener('click', () => cycleVariant(1));
    window.addEventListener('keydown', event => {
      const target = event.target;
      if (target instanceof HTMLElement && target.matches('input, textarea, [contenteditable]')) return;
      if (event.key === 'ArrowLeft') cycleVariant(-1);
      if (event.key === 'ArrowRight') cycleVariant(1);
    });
    setVariant(activeVariant, false);
    setInterval(render, 850);
  </script>
</body>
</html>
